### 2. Concurrency Architecture: Lock-Free Ring Buffer
```typescript
// core/concurrency/RingBuffer.ts
/**
 * Institutional Lock-Free Single-Producer Single-Consumer (SPSC) Ring Buffer.
 * Backed by SharedArrayBuffer and synchronized using hardware-level Atomics.
 * Prevents main-thread GC pauses and avoids structured cloning overhead.
 *
 * Layout in SharedArrayBuffer:
 * [0]: Head Index (Atomic Int32) - Written by Producer (Ingestion Worker)
 * [1]: Tail Index (Atomic Int32) - Written by Consumer (Main Thread)
 * [2]: Buffer Capacity (Int32)
 * [3]: Reserved Alignment (Int32)
 * [4 ... 4 + Capacity * SLOT_SIZE]: Ring Payload Entries
 *
 * Each Slot contains 6 Floats:
 *  0: Ticker ID (Hash / UInt32 as Float)
 *  1: Timestamp (Epoch milliseconds)
 *  2: LTP (Last Traded Price)
 *  3: Quantity (Executed Kitta)
 *  4: Bid Price (Level 1 Top)
 *  5: Ask Price (Level 1 Top)
 */

export const RING_BUFFER_SLOT_SIZE = 6;
export const RING_BUFFER_HEADER_INT32_COUNT = 4;

export interface MarketTickPayload {
  tickerId: number;
  timestamp: number;
  ltp: number;
  quantity: number;
  bidPrice: number;
  askPrice: number;
}

export class LockFreeRingBuffer {
  private readonly sharedBuffer: SharedArrayBuffer;
  private readonly controlHeader: Int32Array;
  private readonly dataView: Float64Array;
  public readonly capacity: number;

  constructor(sharedBuffer: SharedArrayBuffer, capacity: number = 65536) {
    this.sharedBuffer = sharedBuffer;
    this.capacity = capacity;
    this.controlHeader = new Int32Array(this.sharedBuffer, 0, RING_BUFFER_HEADER_INT32_COUNT);
    
    // Data elements offset past 16-byte header
    const dataByteOffset = RING_BUFFER_HEADER_INT32_COUNT * Int32Array.BYTES_PER_ELEMENT;
    this.dataView = new Float64Array(
      this.sharedBuffer, 
      dataByteOffset, 
      this.capacity * RING_BUFFER_SLOT_SIZE
    );
  }

  public static create(capacity: number = 65536): {
    buffer: SharedArrayBuffer;
    ringBuffer: LockFreeRingBuffer;
  } {
    const totalBytes = 
      (RING_BUFFER_HEADER_INT32_COUNT * Int32Array.BYTES_PER_ELEMENT) +
      (capacity * RING_BUFFER_SLOT_SIZE * Float64Array.BYTES_PER_ELEMENT);
    
    const buffer = new SharedArrayBuffer(totalBytes);
    const ringBuffer = new LockFreeRingBuffer(buffer, capacity);
    
    // Initialize head, tail, capacity
    Atomics.store(ringBuffer.controlHeader, 0, 0); // Head
    Atomics.store(ringBuffer.controlHeader, 1, 0); // Tail
    ringBuffer.controlHeader[2] = capacity;
    
    return { buffer, ringBuffer };
  }

  /**
   * Producer Method: Ingestion Worker pushes tick without locking.
   * Advances Head atomically.
   */
  public push(tick: MarketTickPayload): boolean {
    const head = Atomics.load(this.controlHeader, 0);
    const tail = Atomics.load(this.controlHeader, 1);
    const nextHead = (head + 1) % this.capacity;

    if (nextHead === tail) {
      // Buffer Full: Discard or overwrite based on strategy (here we drop oldest to maintain zero latency)
      Atomics.store(this.controlHeader, 1, (tail + 1) % this.capacity);
    }

    const slotOffset = head * RING_BUFFER_SLOT_SIZE;
    this.dataView[slotOffset + 0] = tick.tickerId;
    this.dataView[slotOffset + 1] = tick.timestamp;
    this.dataView[slotOffset + 2] = tick.ltp;
    this.dataView[slotOffset + 3] = tick.quantity;
    this.dataView[slotOffset + 4] = tick.bidPrice;
    this.dataView[slotOffset + 5] = tick.askPrice;

    // Atomically commit new head position
    Atomics.store(this.controlHeader, 0, nextHead);
    return true;
  }

  /**
   * Consumer Method: Main Render Thread drains available ticks in batch.
   */
  public drainBatch(maxBatch: number = 1024): MarketTickPayload[] {
    const batch: MarketTickPayload[] = [];
    const head = Atomics.load(this.controlHeader, 0);
    let tail = Atomics.load(this.controlHeader, 1);

    while (tail !== head && batch.length < maxBatch) {
      const slotOffset = tail * RING_BUFFER_SLOT_SIZE;
      batch.push({
        tickerId: this.dataView[slotOffset + 0],
        timestamp: this.dataView[slotOffset + 1],
        ltp: this.dataView[slotOffset + 2],
        quantity: this.dataView[slotOffset + 3],
        bidPrice: this.dataView[slotOffset + 4],
        askPrice: this.dataView[slotOffset + 5],
      });
      tail = (tail + 1) % this.capacity;
    }

    // Atomically commit new tail position
    Atomics.store(this.controlHeader, 1, tail);
    return batch;
  }
}

### 3. Binary Ingestion Web Worker with Protobuf & Exponential Backoff
```typescript
// workers/ingestion.worker.ts
import { LockFreeRingBuffer, MarketTickPayload } from '../core/concurrency/RingBuffer';

/**
 * Dedicated Ingestion Worker
 * Handles WebSocket connection, Protobuf binary parsing, Ping/Pong heartbeats,
 * and writes directly to SharedArrayBuffer without cloning.
 */

let ringBuffer: LockFreeRingBuffer | null = null;
let socket: WebSocket | null = null;
let reconnectAttempts = 0;
let reconnectTimer: NodeJS.Timeout | null = null;
let heartbeatInterval: NodeJS.Timeout | null = null;
let isIntentionalDisconnect = false;

const BASE_RECONNECT_DELAY_MS = 1000;
const MAX_RECONNECT_DELAY_MS = 30000;
const HEARTBEAT_INTERVAL_MS = 5000;

// Binary Protobuf Decoder Mock for Market Ticks
function decodeProtobufTick(dataView: DataView): MarketTickPayload {
  // Reads binary fields directly from byte offsets
  // [0..3]: Ticker ID (UInt32)
  // [4..11]: Timestamp (Float64)
  // [12..15]: LTP (Float32)
  // [16..19]: Quantity (Float32)
  // [20..23]: Bid Price (Float32)
  // [24..27]: Ask Price (Float32)
  return {
    tickerId: dataView.getUint32(0, true),
    timestamp: dataView.getFloat64(4, true),
    ltp: dataView.getFloat32(12, true),
    quantity: dataView.getFloat32(16, true),
    bidPrice: dataView.getFloat32(20, true),
    askPrice: dataView.getFloat32(24, true)
  };
}

function computeBackoffWithJitter(attempt: number): number {
  const exponential = Math.min(
    MAX_RECONNECT_DELAY_MS,
    BASE_RECONNECT_DELAY_MS * Math.pow(2, attempt)
  );
  const jitter = Math.random() * 0.5 * exponential; // 50% randomized jitter
  return exponential + jitter;
}

function startHeartbeat() {
  stopHeartbeat();
  heartbeatInterval = setInterval(() => {
    if (socket && socket.readyState === WebSocket.OPEN) {
      const pingBuffer = new Uint8Array([0x09]); // Ping frame
      socket.send(pingBuffer);
    }
  }, HEARTBEAT_INTERVAL_MS);
}

function stopHeartbeat() {
  if (heartbeatInterval) {
    clearInterval(heartbeatInterval);
    heartbeatInterval = null;
  }
}

function connect(wsUrl: string) {
  if (socket) {
    socket.close();
  }

  try {
    socket = new WebSocket(wsUrl);
    socket.binaryType = 'arraybuffer';

    socket.onopen = () => {
      reconnectAttempts = 0;
      startHeartbeat();
      self.postMessage({ type: 'WS_STATUS', status: 'CONNECTED' });
    };

    socket.onmessage = (event: MessageEvent) => {
      if (!(event.data instanceof ArrayBuffer)) return;

      const buffer = event.data;
      const dataView = new DataView(buffer);

      // Check frame header: 0x0A = Market Tick, 0x0A = Pong
      const frameType = dataView.getUint8(0);
      if (frameType === 0x0A && ringBuffer) {
        // Slice tick payload starting at byte 1
        const tickDataView = new DataView(buffer, 1);
        const tick = decodeProtobufTick(tickDataView);
        ringBuffer.push(tick);
      }
    };

    socket.onerror = (err) => {
      self.postMessage({ type: 'WS_ERROR', error: 'WebSocket error occurred' });
    };

    socket.onclose = () => {
      stopHeartbeat();
      self.postMessage({ type: 'WS_STATUS', status: 'DISCONNECTED' });
      if (!isIntentionalDisconnect) {
        scheduleReconnect(wsUrl);
      }
    };
  } catch (err) {
    scheduleReconnect(wsUrl);
  }
}

function scheduleReconnect(wsUrl: string) {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  const delay = computeBackoffWithJitter(reconnectAttempts++);
  reconnectTimer = setTimeout(() => {
    connect(wsUrl);
  }, delay);
}

self.onmessage = (e: MessageEvent) => {
  const { type, sharedBuffer, capacity, wsUrl } = e.data;

  if (type === 'INIT_RING_BUFFER') {
    ringBuffer = new LockFreeRingBuffer(sharedBuffer, capacity);
    self.postMessage({ type: 'RING_BUFFER_READY' });
  } else if (type === 'CONNECT_WEBSOCKET') {
    isIntentionalDisconnect = false;
    connect(wsUrl || 'ws://127.0.0.1:8000/ws/tape');
  } else if (type === 'DISCONNECT') {
    isIntentionalDisconnect = true;
    if (reconnectTimer) clearTimeout(reconnectTimer);
    stopHeartbeat();
    if (socket) socket.close();
  }
};

        high52w: 280.0,
        low52w: 145.0,
        peTTM: 14.8,
        eps: 15.4,
        lockinExpiry: '2025-08-30',
        hasLockinCliff: false,
        cdscSettlementReady: false, // Locked in T+2 batch!
      }
    },
    activeTickerQuotes: {},

    setActiveScreen: (screen) => set((s) => ({ regime: { ...s.regime, activeScreen: screen } })),
    setSelectedSymbol: (symbol) => set({ selectedSymbol: symbol }),
    toggleTapePlayback: () => set((s) => ({ regime: { ...s.regime, isTapePaused: !s.regime.isTapePaused } })),
    toggleRegimeCalibration: () => set((s) => ({
      regime: {
        ...s.regime,
        isLiveMode: !s.regime.isLiveMode,
        isEODReconciled: s.regime.isLiveMode // Flip opposite
      }
    })),

    applyTickBatch: (ticks) => {
      if (ticks.length === 0 || get().regime.isTapePaused) return;

      set((state) => {
        const nextQuotes = { ...state.activeTickerQuotes };
        let nextTickCount = state.regime.lakehouseTickCount + ticks.length;

        for (let i = 0; i < ticks.length; i++) {
          const tick = ticks[i];
          const prev = nextQuotes[tick.tickerId];
          const flash = prev ? (tick.ltp >= prev.ltp ? 'up' : 'down') : null;

          nextQuotes[tick.tickerId] = {
            ltp: tick.ltp,
            bid: tick.bidPrice,
            ask: tick.askPrice,
            flash
          };
        }

        return {
          activeTickerQuotes: nextQuotes,
          regime: { ...state.regime, lakehouseTickCount: nextTickCount }
        };
      });
    }
  }))
);

/**
 * RAF Orchestrator Hook: Drains SharedArrayBuffer and dispatches atomic updates
 */
export function initializeRingBufferSync(ringBuffer: LockFreeRingBuffer) {
  let animId: number;

  const loop = () => {
    const ticks = ringBuffer.drainBatch(512);
    if (ticks.length > 0) {
      useTerminalStore.getState().applyTickBatch(ticks);
    }
    animId = requestAnimationFrame(loop);
  };

  animId = requestAnimationFrame(loop);

  return () => {
    cancelAnimationFrame(animId);
  };
}

// components/screen1/Level2OrderBook.tsx
import React, { useRef, useMemo } from 'react';
import { useVirtualizer } from '@tanstack/react-virtual';

export interface OrderBookRow {
  depth: number;
  bidOrders: number;
  bidQty: number;
  bidPrice: number;
  askPrice: number;
  askQty: number;
  askOrders: number;
}

// Generate 50,000 synthetic rows with deterministically anchored spreads
function generateMockOrderBook(baseLtp: number, totalRows: number = 50000): OrderBookRow[] {
  const rows: OrderBookRow[] = new Array(totalRows);
  for (let i = 0; i < totalRows; i++) {
    const spreadDelta = (i + 1) * 0.5;
    rows[i] = {
      depth: i + 1,
      bidOrders: Math.max(1, Math.floor(Math.sin(i * 0.1) * 8 + 3)),
      bidQty: Math.floor((Math.sin(i * 0.2) + 1.2) * 2500) * 10, // Quantized to 10
      bidPrice: +(baseLtp - spreadDelta).toFixed(1),
      askPrice: +(baseLtp + spreadDelta).toFixed(1),
      askQty: Math.floor((Math.cos(i * 0.2) + 1.2) * 2200) * 10,
      askOrders: Math.max(1, Math.floor(Math.cos(i * 0.1) * 7 + 2)),
    };
  }
  return rows;
}

import React, { useRef, useEffect } from 'react';
import { useTerminalStore } from '../../store/useTerminalStore';

export interface BipartiteNode {
  id: string;
  label: string;
  yRatio: number; // 0..1 vertical spacing
  type: 'broker' | 'equity';
  isCartel?: boolean;
}

export interface BipartiteFlowEdge {
  brokerId: string;
  equityId: string;
  volumeNprM: number;
  isAccumulation: boolean; // Green vs Red
}

export const BROKER_NODES: BipartiteNode[] = [
  { id: 'B58', label: '#58 Naasa', yRatio: 0.15, type: 'broker', isCartel: true },
  { id: 'B45', label: '#45 Imperial', yRatio: 0.28, type: 'broker', isCartel: true },
  { id: 'B34', label: '#34 Vision', yRatio: 0.42, type: 'broker', isCartel: true },

  { id: 'B49', label: '#49 Online', yRatio: 0.70, type: 'broker' },
  { id: 'B57', label: '#57 Aryatara', yRatio: 0.82, type: 'broker' },
  { id: 'B19', label: '#19 Nepal Stock', yRatio: 0.94, type: 'broker' },
];

export const EQUITY_NODES: BipartiteNode[] = [
  { id: 'SAHAS', label: 'SAHAS (Hydro)', yRatio: 0.20, type: 'equity' },
  { id: 'SHIVM', label: 'SHIVM (Cement)', yRatio: 0.35, type: 'equity' },
  { id: 'HDHPC', label: 'HDHPC (Hydro)', yRatio: 0.50, type: 'equity' },
  { id: 'GHL',   label: 'GHL (Hydro)',   yRatio: 0.62, type: 'equity' },
  { id: 'NICA',  label: 'NICA (Bank)',   yRatio: 0.75, type: 'equity' },
  { id: 'NABIL', label: 'NABIL (Bank)',  yRatio: 0.88, type: 'equity' },
];

export const FLOW_EDGES: BipartiteFlowEdge[] = [
  { brokerId: 'B58', equityId: 'SAHAS', volumeNprM: 84.2, isAccumulation: true },
  { brokerId: 'B45', equityId: 'SAHAS', volumeNprM: 61.5, isAccumulation: true },
  { brokerId: 'B34', equityId: 'HDHPC', volumeNprM: 39.8, isAccumulation: true },
  { brokerId: 'B58', equityId: 'SHIVM', volumeNprM: 25.0, isAccumulation: true },
  { brokerId: 'B28', equityId: 'NICA',  volumeNprM: 72.1, isAccumulation: false },
  { brokerId: 'B49', equityId: 'NABIL', volumeNprM: 44.2, isAccumulation: false },
  { brokerId: 'B19', equityId: 'SHIVM', volumeNprM: 1.2,  isAccumulation: true }, // Wash trade
];

export const BipartiteDirectedFlowCanvas: React.FC = () => {
  const canvasRef = useRef<HTMLCanvasElement>(null);
  const isEODReconciled = useTerminalStore((s) => s.regime.isEODReconciled);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let animFrame: number;
    let offset = 0;

    const render = () => {
      const width = (canvas.width = canvas.parentElement?.clientWidth || 800);
      const height = (canvas.height = canvas.parentElement?.clientHeight || 600);

      ctx.clearRect(0, 0, width, height);

      const leftX = width * 0.18;
      const rightX = width * 0.82;

      // 1. Draw Cartel Convex Hull (Amber dashed enclosing Brokers #58, #45, #34)
      const hullBrokers = BROKER_NODES.filter((n) => n.isCartel);
      const minHullY = Math.min(...hullBrokers.map((b) => b.yRatio * height)) - 24;
      const maxHullY = Math.max(...hullBrokers.map((b) => b.yRatio * height)) + 24;

      ctx.save();
      ctx.strokeStyle = '#ffb300';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(leftX - 70, minHullY, width * 0.70, maxHullY - minHullY);
      ctx.fillStyle = 'rgba(255, 179, 0, 0.04)';
      ctx.fillRect(leftX - 70, minHullY, width * 0.70, maxHullY - minHullY);

      // Cartel Label
      ctx.fillStyle = '#ffb300';
      ctx.font = 'bold 10px JetBrains Mono';
      ctx.fillText(
        '⚡ CARTEL ALLIANCE ALPHA: SAHAS FLOAT CORNERING (68.4% CLUSTER SHARE)',
        leftX + 20,
        minHullY + 16
      );
      ctx.restore();

      // 2. Draw Dynamic Bézier Curves
      offset += 0.03;
      FLOW_EDGES.forEach((edge) => {
        const broker = BROKER_NODES.find((b) => b.id === edge.brokerId);
        const equity = EQUITY_NODES.find((e) => e.id === edge.equityId);
        if (!broker || !equity) return;

        const startY = broker.yRatio * height;
        const endY = equity.yRatio * height;
        const controlX1 = leftX + (rightX - leftX) * 0.45;
        const controlX2 = leftX + (rightX - leftX) * 0.55;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(leftX, startY);
        ctx.bezierCurveTo(controlX1, startY, controlX2, endY, rightX, endY);

        ctx.strokeStyle = edge.isAccumulation ? '#00e676' : '#ff1744';
        ctx.lineWidth = Math.min(8, Math.max(1.5, edge.volumeNprM / 12));
        ctx.shadowColor = edge.isAccumulation ? '#00e676' : '#ff1744';
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.restore();
      });

      // 3. Draw Broker Nodes
      BROKER_NODES.forEach((node) => {
        const y = node.yRatio * height;
        ctx.fillStyle = '#10151f';
        ctx.strokeStyle = node.isCartel ? '#ffb300' : '#00e5ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(leftX, y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#f3f4f6';
        ctx.font = 'bold 11px JetBrains Mono';
        ctx.textAlign = 'right';
        ctx.fillText(node.label, leftX - 18, y + 4);
      });

      // 4. Draw Equity Nodes
      EQUITY_NODES.forEach((node) => {
        const y = node.yRatio * height;
        ctx.fillStyle = '#10151f';
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(rightX, y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#00e676';
        ctx.font = 'bold 12px JetBrains Mono';
        ctx.textAlign = 'left';
        ctx.fillText(node.label, rightX + 20, y + 4);
      });

      animFrame = requestAnimationFrame(render);
    };

    render();

    return () => {
      cancelAnimationFrame(animFrame);
    };
  }, [isEODReconciled]);

  return (
    <div className="relative w-full h-full bg-[#0a0e15] border border-[#1e2638] rounded overflow-hidden">
      {/* Engine Status Strip */}
      <div className="absolute top-2 left-3 right-3 flex items-center justify-between text-[11px] pointer-events-none z-10 bg-[#10151f]/80 p-2 rounded border border-[#1e2638]">
        <span className="font-bold text-[#00e5ff]">
          BIPARTITE DIRECTED FLOW ENGINE // ZERO-DOM CANVAS
        </span>
        <span className={isEODReconciled ? 'text-[#00e676]' : 'text-[#ffb300]'}>
          {isEODReconciled
            ? '● EOD RECONCILED: 149,008 TICKS (EXACT FLOORSHEET)'
            : '◐ LIVE BAYESIAN PROXY FEED (11:00-15:00)'}
        </span>
      </div>

      <canvas ref={canvasRef} className="w-full h-full block" />
    </div>
  );
};
