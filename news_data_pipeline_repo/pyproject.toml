[project]
name = "nepali-news-scrapers"
version = "0.1.6"
description = ""
authors = [
    {name = "codera21",email = "atul.nepal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4 (>=0.0.2,<0.0.3)",
    "requests (>=2.33.0,<3.0.0)",
    "nepali (>=1.1.2,<2.0.0)",
    "minio (>=7.2.15,<8.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "google-genai (>=1.5.0,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "instaloader (>=4.14.1,<5.0.0)",
    "tweepy (>=4.15.0,<5.0.0)",
    "pdfplumber (>=0.11.5,<0.12.0)",
    "schedule (>=1.2.2,<2.0.0)",
    "fuzzywuzzy (>=0.18.0,<0.19.0)",
    "python-levenshtein (>=0.27.1,<0.28.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "lxml (>=6.1.0,<7.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "playwright (>=1.58.0,<2.0.0)",
    "nepse-scraper (>=1.0.0,<2.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "cachetools (>=7.0.1,<8.0.0)",
]
# Specify the package folder explicitly:
packages = [
    { include = "nepali_news_scrapers" },
        { include = "nepali_news_scrapers/**/*.py" } 

]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode= false



[tool.poetry.group.dev.dependencies]
bump2version = "^1.0.1"

[tool.poetry.scripts]
run = "nepali_news_scrapers.main:run_scraper"


