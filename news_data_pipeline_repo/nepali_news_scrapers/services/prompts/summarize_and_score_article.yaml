prompt: |
  Analyze the following news article and provide:
  
  1. A concise summary in 1-2 lines, including any specific numbers, statistics, or data important for NEPSE and stock-related information.
  2. An impact score (0-1) indicating how significant the news is for the stock market and NEPSE.
  3. A relevance score (0-1) indicating how closely the news is related to the stock market and NEPSE.

  Return the response in the following JSON format:
  {{
    "summary": "<summary text>",
    "impact_score": <number>,
    "relevance_score": <number>
  }}

  News Article:
  {content}