prompt: |
  Analyze the following news articles and identify the most important topics
  related to NEPSE and the stock market. Even with few articles, extract key insights.
  Focus on the most significant themes, keywords, and their potential impact.
  Include all numerical data (e.g., percentages, quantities, financial figures, dates)
  within the description of each topic.
  
  Return the topics as concise, engaging bullet points. Each topic should include:
  - A catchy headline (1-2 phrases)
  - Brief explanation/context with all numbers and statistics embedded
  - Sources (extract website names from URLs)
  
  Format as JSON array:
  [
    {{"topic": "Stock Market Surge", "description": "NEPSE index gained 25 points due to strong banking sector performance...", "sources": ["Kantipur"]}},
    {{"topic": "Banking Sector Growth", "description": "Commercial banks reported 15% profit increase...", "sources": ["Setopati"]}}
  ]
  
  Articles:
  {combined_content}