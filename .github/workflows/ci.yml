name: ApexMarketEngine CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Forensic Test Suite & Circuit Breaker Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Blueprint
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Full Institutional Test Suite (264 Tests)
      run: |
        python -m pytest tests/ -v --durations=10
